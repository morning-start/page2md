[project]
name = "page2md"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "morning-start", email = "morning-start@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "drissionpage>=4.1.1.2",
